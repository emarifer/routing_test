name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          gleam-version: "1.13.0"
          rebar3-version: "3"
      - name: Install dependencies
        run: gleam deps download
      - name: Print Repository Name
        run: |
            echo ${{ github.repository }}
      - name: Add Repository Path
        run: |
          sed -i -e 's|Index -> "/"|Index -> "/routing_test/"|g' src/routing_test.gleam
      - name: Build app
        run: gleam run -m lustre/dev build routing_test --minify --outdir=dist
      - name: Fixing Links
        run: |
          sed -i -e 's|href="/routing_test.css"|href="./routing_test.css"|g; s|src="/routing_test.js"|src="./routing_test.js"|g' dist/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4